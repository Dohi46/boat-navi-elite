name: Premium research validation
on:
  push:
    branches: [feature/premium-research-v1]
    paths:
      - 'scripts/premium_*.py'
      - 'tests/test_premium_*.py'
      - 'data/auto/*.json'
      - '.github/workflows/premium-research.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_premium_*.py' -v
      - name: Compare actual snapshot settlement totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.premium_backtest import evaluate
          for path in sorted(Path('data/auto').glob('*.json')):
              doc=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(doc,dict) or not isinstance(doc.get('races'),list):
                  continue
              result=evaluate(doc)
              settlement=doc.get('settlement') or {}
              if result['unsettled_races']==0 and settlement.get('settledRaces')==result['baseline']['races']:
                  assert abs(result['baseline']['stake']-settlement['stake']) < 0.01, path
                  assert abs(result['baseline']['payout']-settlement['payout']) < 0.01, path
              print(path, result['baseline']['races'], result['baseline']['return_rate_percent'])
          PY

      - name: Build research aggregates without publishing picks
        run: |
          python scripts/premium_dashboard_report.py data/auto/*.json --output /tmp/premium-research-summary.json
      - name: Validate daily totals and research-only safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/premium-research-summary.json').read_text())
          assert report['schema']=='premium-dashboard-v1'
          assert report['mode']=='research_only'
          assert report['ready_for_premium'] is False
          daily=report['daily']
          assert sum(d['settled_races'] for d in daily)==report['baseline']['settled_races']
          for key in ('stake','payout','hit_races'):
              assert abs(sum(d[key] for d in daily)-report['baseline'][key])<0.01, key
          assert 'picks' not in json.dumps(report)
          print('Research-only aggregate validated for',len(daily),'days')
          PY
      - name: Upload research aggregate for review
        uses: actions/upload-artifact@v4
        with:
          name: premium-research-aggregate
          path: /tmp/premium-research-summary.json
          retention-days: 14
