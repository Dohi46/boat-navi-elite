name: Premium research validation
on:
  push:
    branches: [feature/premium-research-v1]
    paths:
      - 'scripts/premium_*.py'
      - 'tests/test_premium_*.py'
      - 'data/auto/*.json'
      - '.github/workflows/premium-schedule-scan.yml'
      - 'premium/index.html'
      - 'premium/research-summary.json'
      - '.github/workflows/premium-research.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_premium_*.py' -v
      - name: Compare actual snapshot settlement totals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.premium_backtest import evaluate
          for path in sorted(Path('data/auto').glob('*.json')):
              doc=json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(doc,dict) or not isinstance(doc.get('races'),list):
                  continue
              result=evaluate(doc)
              settlement=doc.get('settlement') or {}
              if result['unsettled_races']==0 and settlement.get('settledRaces')==result['baseline']['races']:
                  assert abs(result['baseline']['stake']-settlement['stake']) < 0.01, path
                  assert abs(result['baseline']['payout']-settlement['payout']) < 0.01, path
              print(path, result['baseline']['races'], result['baseline']['return_rate_percent'])
          PY

      - name: Build research aggregates without publishing picks
        run: |
          python scripts/premium_dashboard_report.py data/auto/*.json --output /tmp/premium-research-summary.json
      - name: Validate daily totals and research-only safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/premium-research-summary.json').read_text())
          assert report['schema']=='premium-dashboard-v1'
          assert report['mode']=='research_only'
          assert report['ready_for_premium'] is False
          daily=report['daily']
          assert sum(d['settled_races'] for d in daily)==report['baseline']['settled_races']
          for key in ('stake','payout','hit_races'):
              assert abs(sum(d[key] for d in daily)-report['baseline'][key])<0.01, key
          assert 'picks' not in json.dumps(report)
          assert all(c['selected_races'] + c['excluded_baseline']['selected_races'] == report['baseline']['selected_races'] for c in report['conditions'])
          for c in report['conditions']:
              for key in ('stake','payout','hit_races'):
                  assert abs(c[key] + c['excluded_baseline'][key] - report['baseline'][key]) < 0.01, (c['name'], key)
          print('Research-only aggregate validated for',len(daily),'days')
          PY
      - name: Generate chronological holdout report
        run: |
          python scripts/premium_walkforward.py data/auto/*.json --min-train-days 14 > /tmp/premium-walkforward.json
      - name: Validate chronological separation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/premium-walkforward.json').read_text())
          assert report['mode']=='research_only'
          assert report['ready_for_premium'] is False
          for fold in report['folds']:
              assert fold['train_dates']
              assert all(d < fold['evaluation_date'] for d in fold['train_dates'])
              assert fold['evaluation_date'] not in fold['train_dates']
          print('Chronological folds:',report['fold_count'])
          PY
      - name: Upload chronological research report
        uses: actions/upload-artifact@v4
        with:
          name: premium-walkforward-research
          path: /tmp/premium-walkforward.json
          retention-days: 14
      - name: Build offline integration safety report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.premium_integration import integrate
          report=integrate({'races':[]})
          assert report['ready_for_premium'] is False
          Path('/tmp/premium-integration-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Prepare offline preview bundle
        run: |
          mkdir -p /tmp/premium-preview
          cp premium/index.html /tmp/premium-preview/index.html
          cp /tmp/premium-research-summary.json /tmp/premium-preview/research-summary.json
          cp /tmp/premium-walkforward.json /tmp/premium-preview/walkforward.json
          cp /tmp/premium-integration-report.json /tmp/premium-preview/integration-report.json
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/premium-preview/index.html').read_text(encoding='utf-8')
          assert "fetch('./research-summary.json'" in html
          assert "fetch('./walkforward.json'" in html
          assert Path("/tmp/premium-preview/walkforward.json").is_file()
          assert "fetch(\'./integration-report.json\'" in html
          assert Path("/tmp/premium-preview/integration-report.json").is_file()
          assert '研究プレビュー' in html
          print('Research preview bundle ready; no deployment or repository writes')
          PY
      - name: Upload offline research preview
        uses: actions/upload-artifact@v4
        with:
          name: premium-research-preview
          path: /tmp/premium-preview/
          retention-days: 14
      - name: Upload research aggregate for review
        uses: actions/upload-artifact@v4
        with:
          name: premium-research-aggregate
          path: /tmp/premium-research-summary.json
          retention-days: 14
      - name: Probe official deadlines and pre-cutoff capture (research only)
        if: github.event_name == 'push'
        timeout-minutes: 3
        run: |
          python -m scripts.premium_schedule_scan --venue 2 --auto-upcoming --output /tmp/premium-schedule-scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/premium-schedule-scan.json').read_text(encoding='utf-8'))
          assert r['mode']=='research_only' and r['ready_for_premium'] is False
          assert len(r['results'])<=1
          assert len(r.get('candidates',[]))<=6
          for candidate in r.get('candidates',[]):
              print('candidate:',candidate['race'],'status:',candidate['status'])
          print('OUTCOME:',r.get('outcome','unknown'))
          for x in r['results']:
              print('race:',x['race'],'status:',x['status'],
                    'weather:',x.get('weather_parsed','unknown'),
                    'exhibition:',x.get('exhibition_parsed','unknown'))
          if r.get('outcome') != 'capture_with_both_fields':
              print('RESEARCH DATA NOT COMPLETE: do not interpret green CI as a successful full capture')
          print('NOTE: unknown deadline or failed fetch is not a successful capture')
          from os import environ
          summary = environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              outcome = r.get('outcome', 'unknown')
              rows = [
                  '## Official data collection — research only',
                  '',
                  f'- Outcome: `{outcome}`',
                  f'- Checked date (JST): {r.get("date", "unknown")}',
                  f'- Venue code: {r.get("venue", "unknown")}',
                  f'- Candidates checked: {len(r.get("candidates", []))}',
                  f'- Full captures: {sum(x.get("status") == "captured" and bool(x.get("weather_parsed")) and bool(x.get("exhibition_parsed")) for x in r["results"])}',
                  '',
                  '| Race | Status | Weather | Exhibition |',
                  '|---|---|---|---|',
              ]
              for x in r['results']:
                  rows.append(f'| {x.get("race", "?")} | {x.get("status", "?")} | {bool(x.get("weather_parsed"))} | {bool(x.get("exhibition_parsed"))} |')
              if outcome != 'capture_with_both_fields':
                  rows.extend(['', '**Not a verified full capture. Green CI only means the checks ran successfully.**'])
              Path(summary).open('a', encoding='utf-8').write('\n'.join(rows) + '\n')
          PY
      - name: Build sanitized official capture digest
        if: github.event_name == 'push'
        run: python -m scripts.premium_capture_digest /tmp/premium-schedule-scan.json --output /tmp/premium-capture-digest.json
      - name: Upload sanitized capture digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: premium-capture-digest
          path: /tmp/premium-capture-digest.json
          retention-days: 14
      - name: Upload official schedule research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-schedule-scan
          path: /tmp/premium-schedule-scan.json
          if-no-files-found: ignore
          retention-days: 7
