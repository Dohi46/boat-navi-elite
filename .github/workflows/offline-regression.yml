name: BOAT NEXUS offline regression tests
on:
  push:
    paths:
      - 'tools/test_shadow_lock.cjs'
      - 'tools/test_settlement_audit.cjs'
      - 'tools/test_mobile_navigation.cjs'
      - 'index.html'
      - 'odds-free.html'
      - 'app.js'
      - 'tools/generate_shadow_predictions.cjs'
      - 'tools/audit_prediction_health.cjs'
      - 'tools/operations_health.cjs'
      - 'tools/operations_health_policy.cjs'
      - 'tools/test_operations_health.cjs'
      - 'tools/test_workflow_safety.cjs'
      - '.github/workflows/daily-predictions.yml'
      - '.github/workflows/settle-predictions.yml'
      - '.github/workflows/operations-health.yml'
      - '.github/workflows/offline-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check tools/generate_shadow_predictions.cjs
          node --check tools/test_shadow_lock.cjs
          node --check tools/test_settlement_audit.cjs
          node --check tools/test_mobile_navigation.cjs
          node --check tools/audit_prediction_health.cjs
          node --check tools/operations_health.cjs
          node --check tools/operations_health_policy.cjs
          node --check tools/test_operations_health.cjs
          node --check tools/test_workflow_safety.cjs
      - name: Test production and shadow workflow isolation
        run: node tools/test_workflow_safety.cjs
      - name: Test operations monitoring classifications
        run: node tools/test_operations_health.cjs
      - name: Test pre-cutoff locks without live data
        run: node tools/test_shadow_lock.cjs
      - name: Check mobile navigation and AI LAB controls
        run: node tools/test_mobile_navigation.cjs
      - name: Test payout integrity and pending results
        run: node tools/test_settlement_audit.cjs
