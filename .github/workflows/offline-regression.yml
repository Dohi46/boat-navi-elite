name: BOAT NEXUS offline regression tests
on:
  push:
    paths:
      - 'tools/test_shadow_lock.cjs'
      - 'tools/test_settlement_audit.cjs'
      - 'tools/generate_shadow_predictions.cjs'
      - 'tools/audit_prediction_health.cjs'
      - '.github/workflows/offline-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check tools/generate_shadow_predictions.cjs
          node --check tools/test_shadow_lock.cjs
          node --check tools/test_settlement_audit.cjs
          node --check tools/audit_prediction_health.cjs
      - name: Test pre-cutoff locks without live data
        run: node tools/test_shadow_lock.cjs
      - name: Test payout integrity and pending results
        run: node tools/test_settlement_audit.cjs
