name: Compare forward prediction strategies
on:
  schedule:
    - cron: '45 16 * * *' # 01:45 JST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check tools/compare_forward_strategies.cjs
      - name: Check odds-free selection audit syntax
        run: node --check tools/audit_odds_free_selection.cjs
      - name: Build odds-free selection research report
        run: node tools/audit_odds_free_selection.cjs > odds-free-selection.json
      - name: Show odds-free selection results
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('odds-free-selection.json','utf8'));
          const fmt=x=>x===null||x===undefined?'未検証':x+'%';
          const n=x=>Number(x||0).toLocaleString('ja-JP');
          const lines=[
            '### オッズなし見送り判断・実績検証',
            '- 締切前に選別を固定したレース: '+r.all.eligible+'R',
            '- 選択: '+r.selected.eligible+'R / 見送り: '+r.selected.skipped+'R',
            '- 選択したレースの結果確定: '+r.selected.settled+'R / 結果待ち: '+r.selected.unsettled+'R',
            '- 全対象の的中数: '+r.all.hits+'点 / 回収率: '+fmt(r.all.roiPct),
            '- 選択レースの的中数: '+r.selected.hits+'点 / 回収率: '+fmt(r.selected.roiPct),
            '- 選択レースの仮想購入: '+n(r.selected.stake)+'円 / 払戻: '+n(r.selected.payout)+'円',
            '- 直近の記録日数: '+r.last7RecordedDays.days+'日（暦日7日間とは限りません）',
            '- 直近記録日の選択: '+r.last7RecordedDays.selected.eligible+'R / 見送り: '+r.last7RecordedDays.selected.skipped+'R',
            '- 直近記録日の選択的中: '+r.last7RecordedDays.selected.hits+'点 / 回収率: '+fmt(r.last7RecordedDays.selected.roiPct),
            '- 日別集計: レポートの daily を参照',
            '- 選択レースでの新旧同条件比較: '+r.pairedSelected.races+'R',
            '- 選択レース・現行AI回収率: '+fmt(r.pairedSelected.baseline.roiPct),
            '- 選択レース・試験AI回収率: '+fmt(r.pairedSelected.shadow.roiPct),
            '- 見送り結果確定: '+r.skipOutcomes.settled+'R',
            '- 見送りで不的中を回避: '+r.skipOutcomes.avoidedLosingRaces+'R',
            '- 見送りで的中を逃した: '+r.skipOutcomes.missedWinningRaces+'R',
            '- 見送り仮想損益回避額: '+n(r.skipOutcomes.netAvoidedLossYen)+'円（見送った買い目を購入した場合との差。負値もあり）',
            '- データ警告: '+r.warnings.length+'件',
            r.selected.settled===0?'※選択レースの確定結果がないため、成績は未検証です。':'※少数レースの結果で優位性は証明できません。'
          ];
          const out=lines.join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          console.log(out);
          NODE
      - name: Build forward-only comparison report
        run: node tools/compare_forward_strategies.cjs > forward-comparison.json
      - name: Show verified comparison status
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('forward-comparison.json','utf8'));
          const fmt=x=>x===null||x===undefined?'未検証':x+'%';
          const lines=[
            '### 新旧AI 実績検証',
            '- 結果確定済み（現行AI）: '+r.settledRaces+'R',
            '- 結果未確定（現行AI）: '+r.unsettledRaces+'R',
            '- 新旧AI 同一レース比較: '+r.pairedRaces+'R',
            '- 現行AI 全体回収率: '+fmt(r.strategies['v13-baseline'].roiPct),
            '- 現行AI 比較対象回収率: '+fmt(r.pairedBaseline.roiPct),
            '- 試験AI 比較対象回収率: '+fmt(r.strategies['feature-shadow'].roiPct),
            '- 検証上の警告: '+r.warnings.length+'件',
            r.comparisonValid?'※同一レースの実績比較。優位性の証明ではありません。':'※比較対象が0件のため、新旧AIの優劣は未検証です。'
          ];
          const out=lines.join('\n')+'\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,out);
          console.log(out);
          NODE
      - name: Upload odds-free research report
        uses: actions/upload-artifact@v4
        with:
          name: odds-free-selection-research
          path: odds-free-selection.json
          retention-days: 30
      - name: Upload comparison report
        uses: actions/upload-artifact@v4
        with:
          name: forward-comparison
          path: forward-comparison.json
          retention-days: 30
