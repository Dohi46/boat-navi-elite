name: Settle BOAT NEXUS predictions
on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes, including daytime (UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-nexus-daily
  cancel-in-progress: false
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match predictions with published trifecta payouts
        run: node tools/settle_daily_predictions.cjs
      - name: Validate experimental collector scripts
        id: experimental_syntax
        continue-on-error: true
        run: |
          node --check tools/collect_odds_snapshots.cjs
          node --check tools/generate_shadow_predictions.cjs
          node --check tools/collect_boatracecsv_observations.cjs
      - name: Test experimental shadow locking
        id: shadow_test
        continue-on-error: true
        run: node tools/test_shadow_lock.cjs
      - name: Lock experimental shadow predictions before cutoff
        id: shadow_generation
        if: steps.experimental_syntax.outcome == 'success' && steps.shadow_test.outcome == 'success'
        continue-on-error: true
        run: node tools/generate_shadow_predictions.cjs
      - name: Capture available pre-cutoff odds observations
        if: steps.experimental_syntax.outcome == 'success'
        continue-on-error: true
        run: node tools/collect_odds_snapshots.cjs
      - name: Collect experimental BoatraceCSV observations
        if: steps.experimental_syntax.outcome == 'success'
        continue-on-error: true
        run: node tools/collect_boatracecsv_observations.cjs
      - name: Verify experimental shadow locks and pre-registered decisions
        if: steps.shadow_generation.outcome == 'success'
        id: shadow_validation
        # Experimental failures must not prevent publication of valid baseline predictions.
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const base=JSON.parse(fs.readFileSync('data/auto/'+date+'.json','utf8'));
          const file='data/shadow/'+date+'.json';
          if(!fs.existsSync(file))throw Error('Experimental shadow snapshot missing: '+file);
          const doc=JSON.parse(fs.readFileSync(file,'utf8'));
          if(doc.date!==date||!doc.races||Array.isArray(doc.races)||typeof doc.races!=='object')throw Error('Invalid experimental shadow snapshot');
          const races=new Map(base.races.map(r=>[r.venue+'-'+r.race,r]));
          const locks=Object.entries(doc.races);
          if(locks.length===0)throw Error('Experimental shadow snapshot contains no locked races');
          let selected=0,skipped=0,legacy=0;
          for(const [key,s] of locks){
            const r=races.get(key);
            const cutoff=r&&Date.parse(String(r.cutoff).replace(' ','T')+'+09:00');
            const locked=Date.parse(s.lockedAt),captured=Date.parse(s.sourceCapturedAt);
            if(!r||!Number.isFinite(cutoff)||!Number.isFinite(locked)||!Number.isFinite(captured)||captured>locked||locked>=cutoff)throw Error('Invalid pre-cutoff shadow lock: '+key);
            if(!s.selection){legacy++;continue;}
            const sel=s.selection;
            if(sel.schema!=='odds-free-selection-v1'||sel.rule!=='lane-adjusted-strength-margin-gte-0.75'||sel.oddsUsed!==false||s.oddsUsed!==false||sel.lockedAt!==s.lockedAt||typeof sel.margin!=='number'||!Number.isFinite(sel.margin)||sel.decision!==(sel.margin>=0.75?'select':'skip'))throw Error('Invalid pre-registered selection: '+key);
            if(sel.decision==='select')selected++;else skipped++;
          }
          console.log('Shadow locks '+locks.length+' / selected '+selected+' / skipped '+skipped+' / legacy '+legacy);
          if(selected+skipped===0)throw Error('No new-format pre-registered shadow decisions were saved');
          NODE
      - name: Report actual saved data
        if: always()
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const summary=['### Prediction data status ('+date+' JST)'];
          for(const [label,dir] of [['Baseline','auto'],['Experimental','shadow'],['Odds','odds']]){
            const file='data/'+dir+'/'+date+'.json';
            if(!fs.existsSync(file)){summary.push('- '+label+': no file');continue;}
            try{
              const doc=JSON.parse(fs.readFileSync(file,'utf8'));
              const n=Array.isArray(doc.races)?doc.races.length:Object.keys(doc.races||{}).length;
              summary.push('- '+label+': '+n+' races saved');
            }catch(e){summary.push('- '+label+': INVALID JSON '+e.message);process.exitCode=1;}
          }
          const shadowFile='data/shadow/'+date+'.json';
          if(fs.existsSync(shadowFile)){
            const doc=JSON.parse(fs.readFileSync(shadowFile,'utf8'));
            const races=Object.values(doc.races||{});
            const selected=races.filter(r=>r.selection?.schema==='odds-free-selection-v1'&&r.selection.decision==='select');
            const skipped=races.filter(r=>r.selection?.schema==='odds-free-selection-v1'&&r.selection.decision==='skip');
            const legacy=races.length-selected.length-skipped.length;
            summary.push('- Odds-free pre-registered: '+(selected.length+skipped.length)+'R (select '+selected.length+'R / skip '+skipped.length+'R)');
            summary.push('- Legacy shadow without selection: '+legacy+'R (excluded from selection audit)');
            summary.push(legacy===races.length&&races.length>0?'- Note: only legacy shadows found; wait for new races before cutoff. Existing records are not backfilled.':'- Existing shadow records are never reclassified after cutoff.');
          }else summary.push('- Odds-free pre-registered: no shadow file yet');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          console.log(summary.join('\n'));
          NODE
      - name: Commit settled results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Settlement revisits up to 14 days of previously saved predictions.
          # Stage updates to tracked history, but never add unrelated new historical files.
          git add -u -- data/auto/
          today=$(TZ=Asia/Tokyo date +%F)
          yesterday=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          for day in "$yesterday" "$today"; do
            if [ -f "data/auto/$day.json" ]; then git add -- "data/auto/$day.json"; fi
            if [ -f "data/odds/$day.json" ]; then git add -- "data/odds/$day.json"; fi
          done
          # Shadow publication is handled only by the validated shadow step.
          if [ -d data/external/boatracecsv ]; then git add -u -- data/external/boatracecsv/; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: settle v13 predictions"
            # Retry if another workflow advances main. Never force push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                echo "Daily snapshot published on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish daily snapshot after retries" >&2
            exit 1
          fi
      - name: Publish validated pre-cutoff shadow locks
        if: steps.shadow_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Asia/Tokyo date +%F)
          # Never rewrite an already published lock, even when a retry follows another push.
          git fetch origin main
          SHADOW_DATE="$today" node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const file='data/shadow/'+process.env.SHADOW_DATE+'.json';
          const local=JSON.parse(fs.readFileSync(file,'utf8'));
          let remote;
          try{remote=JSON.parse(cp.execFileSync('git',['show','origin/main:'+file],{encoding:'utf8'}));}
          catch(e){if(e.status!==128)throw e;}
          if(remote){
            if(remote.date!==local.date)throw Error('Shadow date changed');
            for(const [key,lock] of Object.entries(remote.races||{})){
              if(JSON.stringify(local.races?.[key])!==JSON.stringify(lock))
                throw Error('Published shadow lock cannot change: '+key);
            }
          }
          NODE
          git add -- "data/shadow/$today.json"
          if ! git diff --cached --quiet; then
            git commit -m "data: publish validated intraday shadow locks"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              # Re-check after every rebase: origin/main may have gained locks since validation.
              SHADOW_DATE="$today" node - <<'NODE'
              const cp=require('node:child_process');
              const file='data/shadow/'+process.env.SHADOW_DATE+'.json';
              const local=JSON.parse(cp.execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'}));
              let remote;
              try{remote=JSON.parse(cp.execFileSync('git',['show','origin/main:'+file],{encoding:'utf8'}));}
              catch(e){if(e.status!==128)throw e;}
              if(remote){
                if(remote.date!==local.date)throw Error('Shadow date changed during rebase');
                for(const [key,lock] of Object.entries(remote.races||{})){
                  if(JSON.stringify(local.races?.[key])!==JSON.stringify(lock))
                    throw Error('Concurrent update changed a published shadow lock: '+key);
                }
              }
              NODE
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            echo "Could not publish validated shadow locks" >&2
            exit 1
          fi
      - name: Audit prediction data health
        if: always()
        run: node tools/audit_prediction_health.cjs
