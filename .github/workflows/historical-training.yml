name: Historical race backfill and experimental training
on:
  schedule:
    - cron: '40 16 * * *' # 01:40 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-nexus-daily
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import up to 40 missing historical days per run
        run: python tools/backfill_history.py --days 365 --max-fetch 40
      - name: Install LightGBM
        run: python -m pip install --disable-pip-version-check lightgbm==4.6.0 numpy==2.3.4 scikit-learn==1.7.2
      - name: Train historical venue/lane experiment
        run: python tools/train_historical.py
      - name: Commit historical archive and model results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/ data/models/
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill historical race results and evaluate venue baseline"
            git push
          fi
