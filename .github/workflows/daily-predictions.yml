name: Daily BOAT NEXUS predictions
on:
  schedule:
    - cron: '15 22 * * *' # 07:15 JST (UTC previous day)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-nexus-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression test cutoff and exhibition phase (offline)
        run: node tools/test_prediction_cutoff.cjs
      - name: Collect predictions
        run: node tools/collect_daily_predictions.cjs
      - name: Verify today's baseline snapshot was created
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const file='data/auto/'+date+'.json';
          if(!fs.existsSync(file))throw Error('Daily baseline snapshot missing: '+file);
          const data=JSON.parse(fs.readFileSync(file,'utf8'));
          if(data.date!==date||!Array.isArray(data.races)||data.races.length===0)throw Error('Daily baseline snapshot empty or invalid: '+file);
          const lastRun=Date.parse(data.lastRunAt);
          if(!Number.isFinite(lastRun)||lastRun>Date.now()+60000||Date.now()-lastRun>10*60000)throw Error('Daily baseline snapshot was not refreshed in this run: '+file);
          const keys=new Set();
          for(const r of data.races){
            const key=r.venue+'-'+r.race;
            if(keys.has(key))throw Error('Duplicate baseline race: '+key);
            keys.add(key);
            const captured=Date.parse(r.capturedAt);
            const cutoff=Date.parse(String(r.cutoff).replace(' ','T')+(String(r.cutoff).match(/(?:Z|[+-][0-9]{2}:[0-9]{2})$/)?'':'+09:00'));
            if(r.raceDate!==date||!Number.isFinite(captured)||!Number.isFinite(cutoff)||captured>=cutoff||!Array.isArray(r.picks)||r.picks.length===0)throw Error('Invalid pre-cutoff baseline race: '+key);
          }
          console.log('Verified baseline snapshot: '+date+' / '+data.races.length+' races');
          NODE
      - name: Publish verified production baseline before experimental steps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish only today's verified snapshot; never stage historical files.
          today=$(TZ=Asia/Tokyo date +%F)
          git add -- "data/auto/$today.json"
          if ! git diff --cached --quiet; then
            git commit -m "data: publish verified daily baseline"
            # Retry if another workflow advances main. Never force push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                echo "Production baseline published on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish production baseline after retries" >&2
            exit 1
          fi
      - name: Test pre-cutoff shadow locking (offline)
        continue-on-error: true
        id: shadow_test
        run: node tools/test_shadow_lock.cjs
      - name: Validate experimental shadow generator
        continue-on-error: true
        id: shadow_syntax
        run: node --check tools/generate_shadow_predictions.cjs
      - name: Lock experimental shadow predictions immediately after collection
        if: steps.shadow_test.outcome == 'success' && steps.shadow_syntax.outcome == 'success'
        continue-on-error: true
        id: shadow_generation
        run: node tools/generate_shadow_predictions.cjs
      - name: Verify experimental shadow locks and pre-registered decisions
        if: steps.shadow_generation.outcome == 'success'
        id: shadow_validation
        # Experimental failures must not prevent publication of valid baseline predictions.
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const base=JSON.parse(fs.readFileSync('data/auto/'+date+'.json','utf8'));
          const file='data/shadow/'+date+'.json';
          if(!fs.existsSync(file))throw Error('Experimental shadow snapshot missing: '+file);
          const doc=JSON.parse(fs.readFileSync(file,'utf8'));
          if(doc.date!==date||!doc.races||Array.isArray(doc.races)||typeof doc.races!=='object')throw Error('Invalid experimental shadow snapshot');
          const races=new Map(base.races.map(r=>[r.venue+'-'+r.race,r]));
          const locks=Object.entries(doc.races);
          if(locks.length===0)throw Error('Experimental shadow snapshot contains no locked races');
          let selected=0,skipped=0,legacy=0;
          for(const [key,s] of locks){
            const r=races.get(key);
            const cutoff=r&&Date.parse(String(r.cutoff).replace(' ','T')+'+09:00');
            const locked=Date.parse(s.lockedAt),captured=Date.parse(s.sourceCapturedAt);
            if(!r||!Number.isFinite(cutoff)||!Number.isFinite(locked)||!Number.isFinite(captured)||captured>locked||locked>=cutoff)throw Error('Invalid pre-cutoff shadow lock: '+key);
            if(!s.selection){legacy++;continue;}
            const sel=s.selection;
            if(sel.schema!=='odds-free-selection-v1'||sel.rule!=='lane-adjusted-strength-margin-gte-0.75'||sel.oddsUsed!==false||s.oddsUsed!==false||sel.lockedAt!==s.lockedAt||typeof sel.margin!=='number'||!Number.isFinite(sel.margin)||sel.decision!==(sel.margin>=0.75?'select':'skip'))throw Error('Invalid pre-registered selection: '+key);
            if(sel.decision==='select')selected++;else skipped++;
          }
          console.log('Shadow locks '+locks.length+' / selected '+selected+' / skipped '+skipped+' / legacy '+legacy);
          if(selected+skipped===0)throw Error('No new-format pre-registered shadow decisions were saved');
          NODE
      - name: Summarize experimental validation status
        if: always()
        env:
          SHADOW_OUTCOME: ${{ steps.shadow_validation.outcome }}
          SHADOW_TEST: ${{ steps.shadow_test.outcome }}
          SHADOW_SYNTAX: ${{ steps.shadow_syntax.outcome }}
          SHADOW_GENERATION: ${{ steps.shadow_generation.outcome }}
        run: |
          {
            echo '### Experimental shadow validation'
            if [ "$SHADOW_OUTCOME" = "success" ]; then
              echo '- PASS: pre-cutoff locks and selection decisions validated'
            elif [ "$SHADOW_OUTCOME" = "failure" ]; then
              echo '- WARNING: experimental validation failed; shadow publication skipped'
              echo '- Production baseline publication remains independent of this experimental check'
              echo '::warning::Experimental shadow validation failed. Review the step logs.'
            else
              echo "- NOT RUN: validation outcome was $SHADOW_OUTCOME (test=$SHADOW_TEST, syntax=$SHADOW_SYNTAX, generation=$SHADOW_GENERATION)"
              echo '::warning::Experimental shadow pipeline did not complete; production baseline remains published.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish experimental shadow snapshots
        if: steps.shadow_validation.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Publish only today's validated shadow locks; leave historical locks untouched.
          today=$(TZ=Asia/Tokyo date +%F)
          # Refuse to overwrite a previously published lock, including during retries.
          verify_immutable() {
            SHADOW_DATE="$today" node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process');
          const file='data/shadow/'+process.env.SHADOW_DATE+'.json';
          const local=JSON.parse(fs.readFileSync(file,'utf8'));
          let remote;
          try{remote=JSON.parse(cp.execFileSync('git',['show','origin/main:'+file],{encoding:'utf8',stdio:['ignore','pipe','pipe']}));}
          catch(e){if(e.status!==128)throw e;}
          if(remote){
            if(remote.date!==local.date)throw Error('Shadow date mismatch');
            for(const [key,lock] of Object.entries(remote.races||{})){
              if(JSON.stringify(local.races?.[key])!==JSON.stringify(lock))
                throw Error('Immutable published shadow lock differs: '+key);
            }
          }
          NODE
          }
          git fetch origin main
          verify_immutable
          if [ -f "data/shadow/$today.json" ]; then
            git add -- "data/shadow/$today.json"
          else
            echo "Validated shadow snapshot missing before publication" >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: publish experimental shadow locks"
            # Retry if another workflow advances main. Never force push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              verify_immutable
              if git push origin HEAD:main; then
                echo "Experimental shadow published on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish experimental shadow after retries" >&2
            exit 1
          fi
