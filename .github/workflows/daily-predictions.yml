name: Daily BOAT NEXUS predictions
on:
  schedule:
    - cron: '15 22 * * *' # 07:15 JST (UTC previous day)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: boat-nexus-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect predictions
        run: node tools/collect_daily_predictions.cjs
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto/
          if ! git diff --cached --quiet; then
            git commit -m "data: collect daily v13 predictions"
            # Retry if another workflow advances main. Never force push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                echo "Daily snapshot published on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish daily snapshot after retries" >&2
            exit 1
          fi
