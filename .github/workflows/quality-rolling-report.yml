name: BOAT NEXUS quality and rolling report (offline)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/quality_rolling_report.cjs'
      - '.github/workflows/quality-rolling-report.yml'
permissions:
  contents: write
concurrency:
  group: boat-nexus-quality-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit existing snapshots and calculate rolling virtual performance
        run: |
          mkdir -p data/research
          node tools/quality_rolling_report.cjs data/auto > data/research/quality-rolling-latest.json
          node -e "const r=require('./data/research/quality-rolling-latest.json');console.log(JSON.stringify({files:r.files,checks:r.checks,windows:r.windows},null,2))"
      - name: Commit only changed research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/quality-rolling-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh quality and rolling report"
            git push
          fi
