name: BOAT NEXUS quality and rolling report (offline)
on:
  schedule:
    - cron: '15 15 * * *' # 00:15 JST
  workflow_dispatch:
  push:
    paths:
      - 'tools/quality_rolling_report.cjs'
      - 'tools/check_quality_alerts.cjs'
      - '.github/workflows/quality-rolling-report.yml'
permissions:
  contents: write
concurrency:
  group: boat-nexus-quality-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit existing snapshots and calculate rolling virtual performance
        run: |
          mkdir -p data/research
          node tools/quality_rolling_report.cjs data/auto > data/research/quality-rolling-latest.json
          node -e "const r=require('./data/research/quality-rolling-latest.json');console.log(JSON.stringify({files:r.files,checks:r.checks,windows:r.windows},null,2))"
      - name: Check data integrity and surface GitHub Actions alerts
        run: node tools/check_quality_alerts.cjs data/research/quality-rolling-latest.json
      - name: Commit only changed research report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/quality-rolling-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh quality and rolling report"
            # Another workflow may advance main while this job is running.
            # Retry fast-forward-only publication of this research commit; never force push.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then
                echo "Research report published on attempt $attempt"
                exit 0
              fi
              sleep 2
            done
            echo "Could not publish research report after retries" >&2
            exit 1
          fi
