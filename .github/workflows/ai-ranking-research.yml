name: BOAT NEXUS AI ranking research (offline)
on:
  schedule:
    - cron: '30 15 * * *' # 00:30 JST
  workflow_dispatch:
  push:
    paths:
      - 'tools/ai_safety_ranking.cjs'
      - 'tools/forward_validation.cjs'
      - 'tools/frozen_ai_safety_ranking_v1.cjs'
      - 'data/research/forward-policy-v1.json'
      - '.github/workflows/ai-ranking-research.yml'
permissions:
  contents: write
concurrency:
  group: boat-nexus-ai-ranking
  cancel-in-progress: false
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculate leaderboard from existing stored snapshots
        run: |
          mkdir -p data/research
          node tools/ai_safety_ranking.cjs data/auto > data/research/ai-ranking-latest.json
          node tools/forward_validation.cjs data/auto > data/research/forward-validation-latest.json
          node -e "const d=require('./data/research/forward-validation-latest.json');if(d.selected.races+d.skipped.races!==d.baseline.races)process.exit(1);console.log('Forward cohort',d.filesAnalyzed,'days',d.baseline.races,'races')"
          node -e "const d=require('./data/research/ai-ranking-latest.json');if(!d.filesAnalyzed)process.exit(1);console.log('Files',d.filesAnalyzed,'Eligible',d.quality.eligible,'Ranking',d.strategies)"
      - name: Save research report only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/ai-ranking-latest.json data/research/forward-validation-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "research: refresh offline AI strategy ranking"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
