<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>新旧AI 成績比較 | BOAT NEXUS</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f3f4f6;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:850px;margin:auto;padding:22px 16px 60px}a{color:#d4b06c}.muted{color:#9ba8b8;font-size:13px;line-height:1.7}.card{background:#121a26;border:1px solid #293648;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.metric{background:#182333;border-radius:10px;padding:13px}.metric small{display:block;color:#9ba8b8}.metric b{display:block;font-size:22px;margin-top:5px}button{background:#d4b06c;color:#0b1018;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}select{padding:10px;background:#182333;color:white;border:1px solid #293648;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 5px;border-bottom:1px solid #293648;text-align:right}th:first-child,td:first-child{text-align:left}h1{font-size:23px}h2{font-size:18px}#status{white-space:pre-wrap}</style></head><body><main>
<a href="./index.html">← BOAT NEXUS / RECORDに戻る</a>
<h1>📊 新旧AI 成績比較</h1>
<p class="muted">GitHub保存の朝予想と、締切前に確定した試験AIの予想を照合。すべて仮想購入の成績です。新AIの記録がない場合、成績を捏造せず「未検証」と表示します。</p>
<div class="card"><label for="days">集計期間　</label><select id="days"><option value="7">直近7日</option><option value="14" selected>直近14日</option><option value="30">直近30日</option></select> <button id="refresh">集計する</button><p id="status" class="muted" role="status">読み込み準備中</p></div>
<div id="results"></div>
<p class="muted">的中率＝的中した買い目数÷購入点数。回収率＝払戻合計÷仮想購入額。結果未確定レースは除外。見送りは的中率の分母に含めません。新旧比較は両AIが同じレースを事前予想した場合だけ有効です。1号艇頭の比率は参考指標であり、他艇頭を無理に増やす目標ではありません。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),yen=n=>Math.round(n).toLocaleString('ja-JP')+'円',pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'—';
const valid=p=>p&&typeof p.pick==='string'&&/^[1-6]-[1-6]-[1-6]$/.test(p.pick)&&new Set(p.pick.split('-')).size===3&&Number.isFinite(Number(p.stake))&&Number(p.stake)>0;
const cutoff=s=>typeof s==='string'&&/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(s)?Date.parse(s.replace(' ','T')+'+09:00'):NaN;
const stats=()=>({races:0,picks:0,hits:0,stake:0,paid:0,head1:0,skips:0});
function add(t,picks,winning){t.races++;if(!picks.length)t.skips++;for(const p of picks){if(!valid(p))continue;const amount=Number(p.stake);t.picks++;t.stake+=amount;if(p.pick[0]==='1')t.head1++;if(winning.has(p.pick)){t.hits++;t.paid+=Math.round(amount*winning.get(p.pick)/100);}}}
const card=(name,s)=>'<div class="card"><h2>'+name+'</h2><div class="grid">'+[['対象レース',s.races+'R'],['的中',s.hits+'点'],['的中率',pct(s.hits,s.picks)],['回収率',pct(s.paid,s.stake)],['仮想収支',yen(s.paid-s.stake)],['見送り',s.skips+'R'],['1号艇頭の割合',pct(s.head1,s.picks)]].map(([k,v])=>'<div class="metric"><small>'+k+'</small><b>'+v+'</b></div>').join('')+'</div><p class="muted">仮想購入 '+yen(s.stake)+' ／ 仮想払戻 '+yen(s.paid)+'</p></div>';
async function json(url){const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw Error('HTTP '+r.status);return r.json();}
async function run(){
 $('refresh').disabled=true;$('status').textContent='結果確定済みデータを集計中…';$('results').replaceChildren();
 try{
 const days=Number($('days').value),now=new Date(),dates=[];
 const jstToday=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);
 const start=Date.parse(jstToday+'T00:00:00+09:00');
 for(let i=0;i<days;i++)dates.push(new Date(start-i*86400000+9*3600000).toISOString().slice(0,10));
 const all=await Promise.all(dates.map(async d=>{const [base,shadow]=await Promise.all([json('./data/auto/'+d+'.json'),json('./data/shadow/'+d+'.json')]);return {d,base,shadow};}));
 const baseline=stats(),pairedBase=stats(),pairedShadow=stats();let settled=0,paired=0,missing=0,invalid=0;
 for(const {base,shadow} of all){for(const r of base?.races||[]){
 const payouts=r.result?.winningCombinations;
 if(!Array.isArray(payouts)||!payouts.length)continue;
 const winning=new Map(payouts.filter(x=>/^[1-6]-[1-6]-[1-6]$/.test(x.combination)&&new Set(x.combination.split('-')).size===3&&Number(x.amount)>0).map(x=>[x.combination,Number(x.amount)]));
 if(!winning.size)continue;settled++;add(baseline,r.picks||[],winning);
 const s=shadow?.races?.[r.venue+'-'+r.race];if(!s){missing++;continue;}
 if(s.strategy!=='feature-shadow'||!Array.isArray(s.picks)||!s.picks.every(valid)||!Number.isFinite(Date.parse(s.lockedAt))||!Number.isFinite(Date.parse(s.sourceCapturedAt))||Date.parse(s.sourceCapturedAt)>Date.parse(s.lockedAt)||Date.parse(s.lockedAt)>=cutoff(r.cutoff)||!Number.isFinite(cutoff(r.cutoff))){invalid++;continue;}
 paired++;add(pairedBase,r.picks||[],winning);add(pairedShadow,s.picks,winning);
 }}
 const box=document.createElement('div');box.innerHTML=card('現行AI（全結果確定分）',baseline)+(paired?'<h2>同一レースでの公平な比較</h2>'+card('現行AI（比較対象のみ）',pairedBase)+card('新AI（比較対象のみ）',pairedShadow):'<div class="card"><h2>新AI：未検証</h2><p class="muted">同じレースで締切前に確定した新AIの予想がまだありません。的中率・回収率は表示できません。</p></div>');
 $('results').append(box);
 $('status').textContent='結果確定 '+settled+'R ／ 比較可能 '+paired+'R ／ 新AI未記録 '+missing+'R ／ 無効な新AI記録 '+invalid+'R'+(paired?'\n※比較結果は試験段階。優位性の証明ではありません。':'\n※新AIの予想生成はまだ未稼働です。');
 }catch(e){$('status').textContent='取得に失敗しました：'+e.message;}finally{$('refresh').disabled=false;}
}
$('refresh').addEventListener('click',run);run();
})();
</script></body></html>
