<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>オッズなし厳選AI 実績 | BOAT NEXUS</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f3f4f6;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:920px;margin:auto;padding:22px 16px 60px}a{color:#d4b06c}.muted{color:#9ba8b8;font-size:13px;line-height:1.7}.card{background:#121a26;border:1px solid #293648;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{background:#182333;border-radius:10px;padding:12px}.metric small{display:block;color:#9ba8b8}.metric b{font-size:21px;display:block;margin-top:6px}button,select{font:inherit;border-radius:9px;padding:10px}button{background:#d4b06c;color:#0b1018;border:0;font-weight:700;cursor:pointer}select{background:#182333;color:#fff;border:1px solid #293648}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 6px;border-bottom:1px solid #293648;text-align:right}td:first-child,th:first-child{text-align:left}h1{font-size:23px}h2{font-size:18px}#status{white-space:pre-wrap}</style></head>
<body><main><a href="./index.html">← BOAT NEXUS に戻る</a>
<h1>🎯 オッズなし厳選AI・検証実績</h1><p class="muted">締切前に保存した「選択／見送り」だけを検証します。試験段階の仮想購入成績であり、購入推奨ではありません。オッズは予想に使いません。</p>
<div class="card"><label for="days">集計期間　</label><select id="days"><option value="7">直近7暦日</option><option value="14" selected>直近14暦日</option><option value="30">直近30暦日</option></select> <button id="refresh">再集計</button><p class="muted" id="status" role="status">読み込み中…</p></div>
<div id="results"></div><p class="muted">的中率＝的中買い目数÷購入点数。回収率＝払戻額÷仮想購入額。結果未確定レースは集計対象外です。選択と見送りの判断は予想時点に固定した記録だけを使用します。少数レースの成績は優位性を示しません。</p></main>
<script>(()=>{'use strict';
const $=id=>document.getElementById(id),yen=x=>Math.round(x).toLocaleString('ja-JP')+'円',pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'未検証';
const valid=p=>typeof p?.pick==='string'&&/^[1-6]-[1-6]-[1-6]$/.test(p.pick)&&new Set(p.pick.split('-')).size===3&&Number.isFinite(Number(p.stake))&&Number(p.stake)>0;
const stats=()=>({eligible:0,legacy:0,selected:0,skipped:0,settled:0,unsettled:0,picks:0,hits:0,stake:0,payout:0});
const merge=(a,b)=>{for(const k of Object.keys(a))a[k]+=b[k];};
async function read(url){const r=await fetch(url+'?v='+Date.now(),{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw Error(url+': HTTP '+r.status);return r.json();}
function collect(base,shadow,d){
 const s=stats(),hits=[],skips={settled:0,unsettled:0,avoided:0,missed:0,stake:0,payout:0},paired={baseline:stats(),shadow:stats()};
 for(const r of base?.races||[]){
  const c=shadow?.races?.[r.venue+'-'+r.race],sel=c?.selection;
  if(c&&!sel)s.legacy++;
  if(!c||sel?.schema!=='odds-free-selection-v1'||sel.rule!=='lane-adjusted-strength-margin-gte-0.75'||!['select','skip'].includes(sel.decision)||sel.lockedAt!==c.lockedAt||sel.oddsUsed!==false||c.oddsUsed!==false||!Number.isFinite(sel.margin)||sel.decision!==(sel.margin>=0.75?'select':'skip')||!Array.isArray(c.picks)||!c.picks.every(valid))continue;
  const cutoff=/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(r.cutoff||'')?Date.parse(r.cutoff.replace(' ','T')+'+09:00'):NaN;
  const locked=Date.parse(c.lockedAt),source=Date.parse(c.sourceCapturedAt);
  if(!Number.isFinite(cutoff)||!Number.isFinite(locked)||!Number.isFinite(source)||source>locked||locked>=cutoff)continue;
  s.eligible++;if(sel.decision==='skip')s.skipped++;else s.selected++;
  const winners=r.result?.winningCombinations;
  if(!Array.isArray(winners)||!winners.length){if(sel.decision==='skip')skips.unsettled++;else s.unsettled++;continue;}
  const map=new Map(winners.filter(x=>valid({pick:x.combination,stake:100})&&Number.isInteger(Number(x.amount))&&Number(x.amount)>0).map(x=>[x.combination,Number(x.amount)]));
  if(!map.size){if(sel.decision==='skip')skips.unsettled++;else s.unsettled++;continue;}
  if(sel.decision==='skip'){
   skips.settled++;
   let paid=0,stake=0;
   for(const p of c.picks){const amount=Number(p.stake),pay=map.get(p.pick)||0;stake+=amount;paid+=Math.round(amount*pay/100);}
   skips.stake+=stake;skips.payout+=paid;
   if(paid>0)skips.missed++;else skips.avoided++;
   continue;
  }
  s.settled++;
  if(Array.isArray(r.picks)&&r.picks.length>0&&r.picks.every(valid)){
   for(const [t,picks] of [[paired.baseline,r.picks],[paired.shadow,c.picks]]){
    t.settled++;
    for(const p of picks){const amount=Number(p.stake),pay=map.get(p.pick)||0;t.picks++;t.stake+=amount;if(pay>0){t.hits++;t.payout+=Math.round(amount*pay/100);}}
   }
  }
  for(const p of c.picks){const amount=Number(p.stake),pay=map.get(p.pick)||0;s.picks++;s.stake+=amount;if(pay>0){const payout=Math.round(amount*pay/100);s.hits++;s.payout+=payout;hits.push({d,venue:r.venue,race:r.race,pick:p.pick,odds:pay/100,amount,payout});}}
 }
 return {s,hits,paired,skips};
}
const metric=(label,value)=>'<div class="metric"><small>'+label+'</small><b>'+value+'</b></div>';
async function run(){
 $('refresh').disabled=true;$('status').textContent='GitHub保存データを集計中…';$('results').replaceChildren();
 try{
  const count=Number($('days').value),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const start=Date.parse(today+'T00:00:00+09:00'),dates=Array.from({length:count},(_,i)=>new Date(start-i*86400000+9*3600000).toISOString().slice(0,10));
  const rows=await Promise.all(dates.map(async d=>{const [base,shadow]=await Promise.all([read('./data/auto/'+d+'.json'),read('./data/shadow/'+d+'.json')]);return {d,...collect(base,shadow,d)};}));
  const total=stats(),skips={settled:0,unsettled:0,avoided:0,missed:0,stake:0,payout:0},paired={baseline:stats(),shadow:stats()},hits=[];for(const r of rows){merge(total,r.s);merge(skips,r.skips);merge(paired.baseline,r.paired.baseline);merge(paired.shadow,r.paired.shadow);hits.push(...r.hits);}
  const html='<div class="card"><h2>期間合計</h2><div class="grid">'+metric('事前判定',total.eligible+'R')+metric('旧形式（判定未記録・対象外）',total.legacy+'R')+metric('選択',total.selected+'R')+metric('見送り',total.skipped+'R')+metric('選択・結果確定',total.settled+'R')+metric('的中',total.hits+'点')+metric('的中率',pct(total.hits,total.picks))+metric('回収率',pct(total.payout,total.stake))+metric('仮想収支',yen(total.payout-total.stake))+'</div><p class="muted">仮想購入 '+yen(total.stake)+' ／ 払戻 '+yen(total.payout)+' ／ 選択・結果待ち '+total.unsettled+'R</p></div>'+
  '<div class="card"><h2>⚖️ 選択レースだけで新旧AIを比較</h2><p class="muted">同じ選択レース・結果確定済み・両AIの有効な予想がある場合だけ比較します。各AIの買い目と購入額はそれぞれの保存記録に従います。</p><div class="grid">'+metric('同一比較レース',paired.shadow.settled+'R')+metric('現行AI回収率',pct(paired.baseline.payout,paired.baseline.stake))+metric('試験AI回収率',pct(paired.shadow.payout,paired.shadow.stake))+metric('現行AI的中率',pct(paired.baseline.hits,paired.baseline.picks))+metric('試験AI的中率',pct(paired.shadow.hits,paired.shadow.picks))+'</div><p class="muted">現行AI：購入 '+yen(paired.baseline.stake)+' ／ 払戻 '+yen(paired.baseline.payout)+'　試験AI：購入 '+yen(paired.shadow.stake)+' ／ 払戻 '+yen(paired.shadow.payout)+'</p></div>'+
  '<div class="card"><h2>🔴 見送り判断の事後検証</h2><p class="muted">見送った試験AIの5点を仮に購入していた場合の結果。実際には購入していません。的中を逃したケースも含めます。</p><div class="grid">'+metric('見送り・結果確定',skips.settled+'R')+metric('不的中を回避',skips.avoided+'R')+metric('的中を逃した',skips.missed+'R')+metric('見送り・結果待ち',skips.unsettled+'R')+metric('仮想損益回避額',skips.settled?yen(skips.stake-skips.payout):'未検証')+'</div><p class="muted">見送りレースを仮に購入：'+yen(skips.stake)+' ／ 仮想払戻：'+yen(skips.payout)+'。損益回避額がマイナスの場合、見送りによって仮想利益を逃したことを意味します。</p></div>'+
  '<div class="card" style="overflow-x:auto"><h2>日別成績</h2><table><thead><tr><th>日付</th><th>選択</th><th>見送り</th><th>的中</th><th>的中率</th><th>回収率</th></tr></thead><tbody>'+rows.filter(r=>r.s.eligible).map(r=>'<tr><td>'+r.d+'</td><td>'+r.s.selected+'</td><td>'+r.s.skipped+'</td><td>'+(r.s.selected===0?'—':r.s.settled?r.s.hits:'結果待ち')+'</td><td>'+pct(r.s.hits,r.s.picks)+'</td><td>'+pct(r.s.payout,r.s.stake)+'</td></tr>').join('')+'</tbody></table>'+(total.eligible?'':'<p class="muted">この期間に事前判定が保存されたレースはありません。</p>')+'</div>'+
  '<div class="card" style="overflow-x:auto"><h2>🎯 的中欄（選択レースのみ）</h2>'+(hits.length?'<table><thead><tr><th>日付・場・R</th><th>的中目</th><th>オッズ</th><th>購入</th><th>払戻</th></tr></thead><tbody>'+hits.sort((a,b)=>b.d.localeCompare(a.d)||a.venue-b.venue||a.race-b.race).map(h=>'<tr><td>'+h.d.slice(5)+' '+h.venue+'場 '+h.race+'R</td><td>'+h.pick+'</td><td>'+h.odds.toFixed(1)+'倍</td><td>'+yen(h.amount)+'</td><td>'+yen(h.payout)+'</td></tr>').join('')+'</tbody></table><p class="muted">的中 '+hits.length+'点 ／ 払戻合計 '+yen(total.payout)+'</p>':'<p class="muted">的中記録はまだありません。</p>')+'</div>';
  $('results').innerHTML=html;$('status').textContent='対象 '+count+'暦日 ／ 事前判定 '+total.eligible+'R ／ 選択 '+total.selected+'R ／ 見送り '+total.skipped+'R ／ 旧形式（対象外） '+total.legacy+'R';
 }catch(e){$('status').textContent='読み込みエラー: '+e.message;}finally{$('refresh').disabled=false;}
}
$('refresh').addEventListener('click',run);run();
})();</script></body></html>
